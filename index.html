     o:["편의시설 설치 비용이 크다면 장애인의 이용을 제한해도 차별이 아니다.","관광은 생존과 관계없는 활동이므로 인권 보장의 대상이 아니다.","장애인도 비장애인과 실질적으로 동등하게 관광·문화 활동을 누릴 수 있도록 해야 한다.","민간 사업자의 시설은 국가기관이 개선을 요구할 수 없다."], a:2, s:"10통사2-01-01",
     e:"인권의 범위는 생존과 자유를 넘어 문화·여가 영역까지 넓어지고 있습니다. 인권위는 예산·환경 문제가 정당한 사유가 되기 어렵다며, 실질적으로 동등한 관광 활동을 보장해야 한다고 보았습니다."},
    {q:"국가인권위원회의 ‘권고’에 대한 설명으로 옳은 것은?",
     o:["법적 구속력은 없지만 인권 침해를 바로잡도록 요구하는 권리 구제 수단이다.","법원의 판결과 같아서 따르지 않으면 처벌을 받는다.","국회의 의결을 거쳐야만 효력이 생긴다.","헌법재판소의 위헌 결정과 같은 효력을 가진다."], a:0, s:"10통사2-01-02",
     e:"인권위 권고는 강제력이 없지만, 권고를 받은 기관은 이행 계획을 알려야 하고 사회적으로 큰 영향력을 가집니다. 소송보다 쉽게 이용할 수 있는 시민의 권익 보호 제도입니다."}
  ]
},
{
  id:"a2", unit:"05", date:"2026-09-23", source:"아주경제",
  url:"https://www.ajunews.com/view/20260923095552136",
  title:"7월 출생아 2만 4275명, 7년 만에 최대… 인구는 81개월째 자연감소",
  summary:"국가데이터처 7월 인구동향에 따르면 7월에 태어난 아기는 2만 4275명으로 1년 전보다 11.1% 늘었다. 7월 기준으로 2019년 이후 가장 많고, 합계출산율은 0.89명으로 0.08명 올랐다. 출산에 앞서 나타나는 지표인 혼인 건수도 9.3% 늘어 제주를 뺀 15개 시도에서 증가했다. 그러나 같은 달 사망자가 2만 8921명으로 출생아보다 많아, 인구는 4647명 줄며 81개월 연속 자연감소를 이어 갔다.",
  standards:["10통사2-05-01"],
  questions:[
    {q:"기사 내용과 일치하는 것은?",
     o:["출생아가 늘어 우리나라 인구가 자연증가로 돌아섰다.","혼인 건수가 줄었지만 출생아는 늘었다.","출생아가 늘었지만 사망자가 더 많아 인구 자연감소가 계속되었다.","합계출산율이 1명을 넘어섰다."], a:2, s:"10통사2-05-01",
     e:"7월 출생아는 2만 4275명, 사망자는 2만 8921명이어서 인구가 4647명 자연감소했습니다. 출생 증가만으로는 고령화에 따른 사망 증가를 따라잡지 못하는 상황입니다."},
    {q:"기사에 나온 ‘합계출산율’의 뜻으로 옳은 것은?",
     o:["한 해 동안 태어난 아기의 전체 수","인구 1,000명당 한 해 동안 태어난 아기 수","여성 한 명이 가임 기간(15~49세) 동안 낳을 것으로 예상되는 평균 자녀 수","결혼한 부부 한 쌍이 낳은 자녀의 평균 수"], a:2, s:"10통사2-05-01",
     e:"합계출산율은 여성 한 명이 평생 낳을 것으로 예상되는 평균 자녀 수입니다. 인구를 현재 수준으로 유지하려면 약 2.1명이 필요하므로 0.89명은 여전히 매우 낮은 수준입니다. ②는 조출생률에 대한 설명입니다."},
    {q:"기사가 혼인 건수 증가에 주목한 까닭으로 가장 적절한 것은?",
     o:["혼인이 출산에 앞서 나타나 앞으로의 출생 추세를 짐작하게 하는 지표이기 때문","혼인이 늘면 사망자 수가 곧바로 줄어들기 때문","혼인 건수가 합계출산율 계산에 직접 들어가기 때문","혼인이 늘면 인구의 수도권 집중이 해소되기 때문"], a:0, s:"10통사2-05-01",
     e:"우리나라는 출생의 대부분이 혼인 뒤에 이루어져서, 혼인 증가는 1~2년 뒤 출생 증가로 이어질 가능성이 큽니다. 그래서 혼인을 출산의 ‘선행 지표’라고 부릅니다."}
  ]
},
{
  id:"a3", unit:"03", date:"2026-09-21", source:"한국세정신문",
  url:"https://www.taxtimes.co.kr/news/article.html?no=276965",
  title:"9월 1~20일 수출 714억 달러 ‘역대 최대’… 반도체 비중 47.8%",
  summary:"관세청에 따르면 9월 1일부터 20일까지 수출액은 714억 달러로 1년 전보다 78.3% 늘어 같은 기간 기준 역대 최대를 기록했다. 수입은 484억 달러로 26.7% 늘어 230억 달러의 무역수지 흑자를 냈다. 반도체 수출은 341억 달러로 259.4% 급증해 전체 수출의 47.8%를 차지했고, 석유제품(47.8%)과 승용차(9.3%) 수출도 늘었다.",
  standards:["10통사2-03-04"],
  questions:[
    {q:"기사에 나온 기간의 무역수지로 옳은 것은?",
     o:["230억 달러 적자","230억 달러 흑자","484억 달러 흑자","1,198억 달러 흑자"], a:1, s:"10통사2-03-04",
     e:"무역수지는 수출액에서 수입액을 뺀 값입니다. 714억 달러 − 484억 달러 = 230억 달러로, 수출이 더 많으므로 흑자입니다."},
    {q:"반도체가 전체 수출의 절반 가까이를 차지하는 수출 구조에 대한 평가로 가장 적절한 것은?",
     o:["특정 품목에 의존도가 높아 그 품목의 경기가 나빠지면 전체 수출이 크게 흔들릴 수 있다.","한 품목에 집중할수록 세계 경기 변화의 영향을 전혀 받지 않는다.","수출 품목이 적을수록 무역 상대국과의 갈등이 사라진다.","반도체 수출이 늘면 다른 산업의 수출은 반드시 줄어든다."], a:0, s:"10통사2-03-04",
     e:"수출이 특정 품목에 몰려 있으면 호황일 때는 성과가 크지만, 그 품목의 가격이나 수요가 떨어질 때 충격도 큽니다. 수출 품목과 시장을 다변화하는 것이 지속 가능한 무역의 과제로 꼽힙니다."},
    {q:"우리나라가 반도체를 수출하고 원유를 수입하는 것을 가장 잘 설명하는 개념은?",
     o:["보호 무역","자급자족 경제","비교 우위에 따른 특화와 국제 분업","계획 경제"], a:2, s:"10통사2-03-04",
     e:"자원·노동·자본의 분포가 나라마다 달라서, 각국은 상대적으로 유리한(비교 우위가 있는) 상품을 특화해 생산하고 교역합니다. 원유가 없는 우리나라는 기술과 자본이 집약된 반도체를 수출하고 원유를 수입합니다."}
  ]
},
{
  id:"a4", unit:"03", date:"2026-09-22", source:"글로벌이코노믹",
  url:"https://www.g-enews.com/article/Finance/2026/09/202609221249133348bb91c46fcd_1",
  title:"한국은행 금융안정보고서 “집값·가계대출 오름세 경계”",
  summary:"한국은행은 9월 금융안정보고서에서 수도권 주택 가격과 가계대출이 계속 오르고 있다고 경고했다. 중저가 주택을 중심으로 매수세가 넓어지고 전월세 가격도 빠르게 오르고 있다고 진단했다. 특히 금리가 오르는 과정에서 대출 상환 여력이 약한 취약 차주, 자영업자, 중소기업의 빚 갚을 능력이 떨어질 수 있다고 보았다. 또 저축은행·증권사 등 일부 비은행 금융회사의 유동성비율이 낮아져 자금 조달 부담이 커질 수 있다고 지적했다.",
  standards:["10통사2-03-03"],
  questions:[
    {q:"한국은행이 금리 상승 과정에서 빚을 갚을 능력이 약해질 수 있다고 우려한 대상이 아닌 것은?",
     o:["취약 차주","자영업자","중소기업","대출이 없는 예금자"], a:3, s:"10통사2-03-03",
     e:"금리가 오르면 대출 이자 부담이 커지므로, 소득이 불안정하거나 빚이 많은 취약 차주·자영업자·중소기업이 먼저 어려움을 겪습니다. 대출이 없는 예금자는 오히려 예금 이자가 늘 수 있습니다."},
    {q:"금리가 오를 때 일반적으로 나타나는 현상으로 옳은 것은?",
     o:["변동금리로 돈을 빌린 사람의 이자 부담이 커진다.","예금 이자가 줄어 저축할 이유가 약해진다.","대출을 받으려는 수요가 늘어난다.","이미 발행된 채권의 가격이 오른다."], a:0, s:"10통사2-03-03",
     e:"금리가 오르면 대출 이자가 늘어 변동금리 대출자의 부담이 커지고, 대출 수요는 줄며, 예금 이자는 늘어납니다. 새 채권의 이자가 높아지므로 기존 채권의 가격은 떨어집니다."},
    {q:"기사에 나온 ‘유동성’과 같은 뜻으로 자산 관리 원칙을 설명한 것은?",
     o:["원금을 잃지 않고 안전하게 지킬 수 있는 정도","필요할 때 손실 없이 빨리 현금으로 바꿀 수 있는 정도","투자를 통해 높은 수익을 얻을 수 있는 정도","여러 자산에 나누어 투자하는 방법"], a:1, s:"10통사2-03-03",
     e:"자산 관리의 세 원칙은 안전성, 수익성, 유동성입니다. 유동성은 자산을 쉽게 현금으로 바꿀 수 있는 정도로, 금융회사의 유동성이 낮으면 급히 돈이 필요할 때 대응하기 어렵습니다. ①은 안전성, ③은 수익성, ④는 분산 투자입니다."}
  ]
},
{
  id:"a5", unit:"05", date:"2026-09-13", source:"머니투데이",
  url:"https://www.mt.co.kr/economy/2026/09/13/2026091111194823822",
  title:"시동 건 RE100 산업단지, 전력망·세제·정주 여건이 과제",
  summary:"정부와 국회가 재생에너지를 만든 지역에서 바로 쓰는 ‘지산지소형 RE100 산업단지’를 추진하고 있다. 발의된 법안 11건은 발전 시설, 전력망, 공장, 주거 지역을 하나로 묶어 자립형 도시를 만드는 내용을 담고 있다. 대규모 재생에너지 발전은 호남·영남 등 지방에 몰려 있지만 재생에너지를 필요로 하는 기업의 생산 시설은 수도권에 몰려 있다는 점이 배경이다. 국내 기업의 재생에너지 전력 사용 비중은 2024년 기준 12% 수준이며, 성공하려면 전력 인프라, 세제 혜택, 인력이 살 수 있는 정주 여건이 함께 갖춰져야 한다는 지적이 나온다.",
  standards:["10통사2-05-02","10통사2-02-03"],
  questions:[
    {q:"‘RE100’의 뜻으로 옳은 것은?",
     o:["기업이 쓰는 전력의 100%를 재생에너지로 충당하자는 목표","모든 기업에 탄소 배출을 100% 줄이도록 한 법적 의무","발전량의 100%를 원자력으로 생산하자는 계획","기업의 에너지 소비량을 100% 줄이자는 운동"], a:0, s:"10통사2-05-02",
     e:"RE100(Renewable Energy 100%)은 기업이 사용하는 전력을 모두 태양광·풍력 같은 재생에너지로 바꾸자는 자발적 국제 캠페인입니다. 기후변화 대응을 위한 기업의 역할과 관련됩니다."},
    {q:"기사가 RE100 산업단지 추진의 배경으로 제시한 상황은?",
     o:["재생에너지 발전과 기업 생산 시설이 모두 수도권에 몰려 있다.","재생에너지 발전은 지방에 많지만 기업 생산 시설은 수도권에 몰려 있다.","재생에너지 발전은 수도권에 많지만 기업은 지방에 몰려 있다.","국내 기업은 이미 전력의 대부분을 재생에너지로 쓰고 있다."], a:1, s:"10통사2-05-02",
     e:"에너지를 만드는 곳(지방)과 쓰는 곳(수도권)이 떨어져 있어 먼 거리 송전이 필요합니다. 그래서 전기를 만든 곳 근처에 기업을 두자는 구상이 나왔습니다. 국내 기업의 재생에너지 비중은 12% 수준에 그칩니다."},
    {q:"지방에 RE100 산업단지를 만드는 정책이 공간 불평등 완화에 도움이 될 수 있는 까닭으로 가장 적절한 것은?",
     o:["수도권에 발전소를 더 짓게 하기 때문","지방의 재생에너지 사용을 줄이기 때문","기업과 일자리, 인구가 지방으로 옮겨 가도록 유도할 수 있기 때문","해외에서 전력을 수입하게 되기 때문"], a:2, s:"10통사2-02-03",
     e:"일자리와 기업이 수도권에 몰리면 지역 간 격차가 커집니다. 지방에 산업단지와 정주 여건을 함께 만들면 기업과 인구가 분산되어 공간 불평등을 줄이는 효과를 기대할 수 있습니다."}
  ]
},
{
  id:"a6", unit:"04", date:"2026-09-26", source:"한국일보",
  url:"https://www.hankookilbo.com/news/article/A2026092616200001165",
  title:"젤렌스키, 북한군 포로 한국 송환 공개… 비공개 합의 놓고 공방",
  summary:"우크라이나의 젤렌스키 대통령이 9월 23일 유엔총회 연설에서, 우크라이나군이 러시아 쿠르스크 지역에서 생포한 북한군 포로 2명을 한국으로 보냈다고 밝혔다. 한국 정부는 외교·안보와 한반도 정세에 큰 영향을 주는 민감한 문제인데 비공개로 하기로 한 합의를 깼다며 유감을 나타냈다. 우크라이나에서는 그런 합의가 없었다는 반박과, 관심을 끌기 위한 연출이라는 비판이 함께 나오고 있다.",
  standards:["10통사2-04-02","10통사2-04-03"],
  questions:[
    {q:"기사 내용과 일치하는 것은?",
     o:["러시아 정부가 북한군 포로를 한국에 넘겼다고 발표했다.","한국 정부가 기자회견을 열어 포로 송환 사실을 먼저 공개했다.","젤렌스키 대통령이 유엔총회 연설에서 북한군 포로 2명을 한국에 보냈다고 밝혔다.","북한군 포로들은 북한으로 돌려보내졌다."], a:2, s:"10통사2-04-02",
     e:"우크라이나군이 생포한 북한군 포로 2명의 한국 송환 사실은 젤렌스키 대통령의 유엔총회 연설로 처음 공개되었습니다."},
    {q:"한국 정부가 유감을 나타낸 주된 이유는?",
     o:["포로를 한국으로 보내지 않았기 때문","비공개로 하기로 한 합의를 공개했기 때문","우크라이나가 한국에 무기를 요구했기 때문","유엔이 한국을 비판하는 결의를 채택했기 때문"], a:1, s:"10통사2-04-02",
     e:"한국 정부는 외교·안보에 민감한 사안이라 비공개로 하기로 했는데 이를 어겼다고 보았습니다. 국가 간 협력에서도 신뢰가 깨지면 갈등이 생길 수 있음을 보여 주는 사례입니다."},
    {q:"이 사례에 등장하는 국제 사회의 행위 주체 가운데 ‘국제기구’에 해당하는 것은?",
     o:["우크라이나 정부","국제 연합(UN) 총회","한국 정부","북한군 포로"], a:1, s:"10통사2-04-02",
     e:"국제 사회의 행위 주체에는 국가, 국제기구, 비정부 기구(NGO), 개인 등이 있습니다. 국제 연합(UN)은 여러 나라가 모인 대표적인 정부 간 국제기구로, 총회는 각국이 입장을 밝히고 협력을 논의하는 자리입니다."}
  ]
}
];

// ---------- state ----------
let unitFilter = "all";
const answers = {};           // articleId -> {qi: chosenIndex}
let extra = [];               // teacher-generated articles (session only)
const all = () => [...extra, ...ARTICLES];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => { const [y,m,dd] = d.split("-"); return `${y}. ${+m}. ${+dd}.`; };

function windowText(){
  const u = new Date(UPDATED+"T00:00:00");
  const from = new Date(u); from.setMonth(from.getMonth()-1);
  const f = from.toISOString().slice(0,10);
  $("#window").textContent = `${fmt(f)} ~ ${fmt(UPDATED)} 사이에 나온 기사로 만들었어요`;
}
function renderStats(){
  const arts = all(); let done=0, right=0, total=0;
  arts.forEach(a=>{const s=scoreOf(a); done+=s.done; right+=s.right; total+=s.total;});
  $("#stats").innerHTML = `<span class="stat">기사 <b>${arts.length}</b>개</span><span class="stat">문제 <b>${total}</b>개</span><span class="stat">내가 맞힌 문제 <b>${right}</b>개</span>`;
}

function renderChips(){
  const opts = [["all","전체"], ...Object.entries(UNITS).map(([k,v])=>[k, `${+k}. ${v.name}`])];
  $("#chips").innerHTML = opts.map(([k,l]) => `<button class="chip" data-u="${k}" style="--c:var(${k==="all"?"--accent":UNITS[k].c})" aria-pressed="${unitFilter===k}"><i></i>${esc(l)}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(b => b.onclick = () => { unitFilter = b.dataset.u; renderChips(); renderList(); });
}

function scoreOf(a){
  const ans = answers[a.id] || {};
  const done = Object.keys(ans).length;
  const right = a.questions.filter((q,i)=>ans[i]===q.a).length;
  return {done, right, total:a.questions.length};
}

function renderList(){
  renderStats();
  const items = all().filter(a => unitFilter==="all" || a.unit===unitFilter)
    .sort((x,y)=> (y.mine?1:0)-(x.mine?1:0) || y.date.localeCompare(x.date));
  if(!items.length){ $("#list").innerHTML = `<p class="status">이 단원에 해당하는 기사가 아직 없어요.</p>`; return; }
  $("#list").innerHTML = items.map(a => {
    const u = UNITS[a.unit] || {name:"통합사회2", c:"--accent"};
    const sc = scoreOf(a);
    const st = sc.done===sc.total ? `<span class="score done">${sc.right}/${sc.total} 정답</span>` : sc.done ? `<span class="score">${sc.done}/${sc.total} 풀이 중</span>` : `<span class="score">${sc.total}문항</span>`;
    return `<button class="item" data-id="${a.id}">
      <span class="bar" style="background:var(${u.c})"></span>
      <span style="min-width:0"><span class="t">${esc(a.title)}</span>
        <span class="meta"><span class="unit" style="color:var(${u.c})">${esc(u.name)}</span><span>${esc(a.source)}</span><span>${a.date?fmt(a.date):""}</span>${a.mine?"<span>직접 만든 문제</span>":""}</span></span>
      ${st}</button>`;
  }).join("");
  $("#list").querySelectorAll(".item").forEach(b => b.onclick = () => open(b.dataset.id));
}

function open(id){
  const a = all().find(x=>x.id===id); if(!a) return;
  const u = UNITS[a.unit] || {name:"통합사회2", c:"--accent"};
  const ans = answers[a.id] || (answers[a.id] = {});
  const v = $("#view");
  v.innerHTML = `
    <button class="back" id="back">← 기사 목록</button>
    <article class="article">
      <div class="meta"><span class="unit" style="color:var(${u.c})">${esc(u.name)}</span><span>${esc(a.source)}</span><span>${a.date?fmt(a.date):""}</span></div>
      <h2>${esc(a.title)}</h2>
      <p class="summary">${esc(a.summary)}</p>
      <div class="std">${a.standards.map(s=>`<span title="${esc(STANDARDS[s]||"")}">[${esc(s)}]</span>`).join("")}</div>
      ${a.url?`<div class="src">원문: <a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)} 기사 보기</a></div>`:""}
    </article>
    <div class="qs">${a.questions.map((q,i)=>`
      <div class="q" data-i="${i}">
        <div class="qn"><span>문제 ${i+1}</span><span>[${esc(q.s||"")}]</span></div>
        <div class="qt">${esc(q.q)}</div>
        <div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}"><span class="n">${"①②③④⑤"[j]}</span><span>${esc(o)}</span></button>`).join("")}</div>
        <div class="exp" hidden></div>
      </div>`).join("")}</div>
    <div class="result" id="result" hidden></div>`;
  $("#home").hidden = true; v.hidden = false; window.scrollTo(0,0);
  $("#back").onclick = close;
  v.querySelectorAll(".q").forEach(qel => {
    const i = +qel.dataset.i;
    qel.querySelectorAll(".opt").forEach(b => b.onclick = () => { ans[i] = +b.dataset.j; paint(a); });
  });
  paint(a);
}

function paint(a){
  const ans = answers[a.id];
  $("#view").querySelectorAll(".q").forEach(qel => {
    const i = +qel.dataset.i, q = a.questions[i];
    if(ans[i]===undefined) return;
    qel.querySelectorAll(".opt").forEach(b => {
      const j = +b.dataset.j; b.disabled = true;
      b.classList.toggle("right", j===q.a);
      b.classList.toggle("wrong", j===ans[i] && j!==q.a);
    });
    const ex = qel.querySelector(".exp"); ex.hidden = false;
    ex.innerHTML = (ans[i]===q.a ? `<b class="ok">정답입니다.</b> ` : `<b class="no">정답은 ${"①②③④⑤"[q.a]}번입니다.</b> `) + esc(q.e);
  });
  const sc = scoreOf(a), r = $("#result");
  if(sc.done===sc.total){
    r.hidden = false;
    r.innerHTML = `<span>이 기사 결과 <strong>${sc.right} / ${sc.total}</strong></span><span class="row"><button class="btn ghost" id="retry">다시 풀기</button><button class="btn" id="next">다른 기사 풀기</button></span>`;
    $("#retry").onclick = () => { answers[a.id] = {}; open(a.id); };
    $("#next").onclick = close;
  }
}

function close(){ $("#view").hidden = true; $("#home").hidden = false; renderList(); window.scrollTo(0,0); }

windowText(); renderChips(); renderList();
</script>

</body>
</html>
